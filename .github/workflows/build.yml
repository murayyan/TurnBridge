name: Build TurnBridge IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild -project TurnBridge.xcodeproj \
            -scheme TurnBridge \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/TurnBridge.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/TurnBridge.xcarchive/Products/Applications/TurnBridge.app build/Payload/
          cd build && zip -r TurnBridge.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurnBridge-unsigned-ipa
          path: build/TurnBridge.ipa
